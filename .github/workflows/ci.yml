name: Cross-platform CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Built CLI and data-root smoke test
        run: npm run test:cli-data-root
      - name: Unit and subprocess tests
        run: npm test
      - name: Prepare user systemd manager
        if: runner.os == 'Linux' && matrix.node == 24
        shell: bash
        run: |
          runner_uid=$(id -u)
          echo "XDG_RUNTIME_DIR=/run/user/$runner_uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$runner_uid/bus" >> "$GITHUB_ENV"
          sudo systemctl start "user@$runner_uid.service"
      - name: Native service smoke tests
        if: matrix.node == 24
        run: npm run test:native-service
